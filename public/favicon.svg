<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#090d16" stroke="url(#grad)" stroke-width="3"/>
  <!-- AI Hexagon / Node Connections -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4" />
  <circle cx="50" cy="15" r="4" fill="#00f2fe" />
  <circle cx="80" cy="32" r="4" fill="#4facfe" />
  <circle cx="80" cy="68" r="4" fill="#6366f1" />
  <circle cx="50" cy="85" r="4" fill="#00f2fe" />
  <circle cx="20" cy="68" r="4" fill="#4facfe" />
  <circle cx="20" cy="32" r="4" fill="#6366f1" />
  <text x="50" y="58" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="28" fill="url(#grad)" text-anchor="middle" letter-spacing="-1">SFS</text>
</svg>
